name: Purge Cloudflare cache

# Cloudflare keeps a copy of every page so visitors get it quickly. Once Vercel
# has published a new version of the site, that copy is out of date, so we
# throw it away and Cloudflare fetches the fresh pages on the next visit.
#
# It can also be run by hand from the Actions tab.
on:
  deployment_status:
  workflow_dispatch:

jobs:
  purge:
    # Vercel reports on every deployment, including previews and failed builds.
    # Only a successful production deployment changes what visitors see.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      # Give Vercel a moment to point the domain at the new build, otherwise
      # Cloudflare could fetch and keep the old pages again straight away.
      - name: Wait for the domain to switch over
        if: github.event_name == 'deployment_status'
        run: sleep 30

      - name: Purge everything
        env:
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          response=$(curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')
          echo "$response"
          echo "$response" | jq -e '.success == true' > /dev/null
